      <a href="#" data-cta="wholesale" aria-label="店舗様・卸販売はこちら"><img class="cta-img" src="https://ajara-llc.github.io/shusyasosei-lp/assets/btn-wholesale.webp" alt="店舗様・卸販売はこちら（LINEでご案内いたします）"></a>

  </div>

<script>
  (function(){
    var root = document.currentScript ? document.currentScript.closest('.ssg-lp') : document.querySelector('.ssg-lp');
    if(!root) return;
    // ハンバーガーメニュー開閉
    var btn = root.querySelector('.ssg-navbtn');
    var menu = root.querySelector('#ssgNavMenu');
    var mcta = root.querySelector('.ssg-mcta');
    // テーマのtransform/contain付きラッパーから逃がすため<body>直下へ移動(fixedをビューポート基準にする)
    try{ if(btn) document.body.appendChild(btn); if(menu) document.body.appendChild(menu); if(mcta) document.body.appendChild(mcta); }catch(e){}
    if(btn && menu){
      var setOpen = function(open){
        btn.setAttribute('aria-expanded', open);
        btn.setAttribute('aria-label', open ? 'メニューを閉じる' : 'メニューを開く');
        menu.classList.toggle('open', open);
        document.body.classList.toggle('nav-open', open);
      };
      btn.addEventListener('click', function(){ setOpen(btn.getAttribute('aria-expanded') !== 'true'); });
      menu.addEventListener('click', function(e){ if(e.target.closest('a')) setOpen(false); });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') setOpen(false); });
    }
    // スクロール フェードイン
    var els = root.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){
      els.forEach(function(e){ e.classList.add('in'); });
    } else {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
      },{rootMargin:'0px 0px -8% 0px',threshold:.05});
      els.forEach(function(e){ io.observe(e); });
    }
  })();
</script>
</div>
